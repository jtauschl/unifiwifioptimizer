[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "unifiwifioptimizer"
dynamic = ["version"]
description = "Read-only RF-tuning and WLAN-baseline recommendations for UniFi access points"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jürgen Tauschl", email = "juergen.tauschl@gmail.com" }]
# 3.11 floor: the design relies on StrEnum, typing.Self and ExceptionGroup without compatibility shims.
requires-python = ">=3.11"
# The only runtime dependency. 6.0 is the first release with CPython 3.11 wheels.
dependencies = ["pyyaml>=6.0"]
keywords = ["unifi", "wifi", "rf", "roaming", "ubiquiti"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jtauschl/unifiwifioptimizer"
Changelog = "https://github.com/jtauschl/unifiwifioptimizer/blob/main/CHANGELOG.md"
Issues = "https://github.com/jtauschl/unifiwifioptimizer/issues"
Security = "https://github.com/jtauschl/unifiwifioptimizer/blob/main/SECURITY.md"

[project.scripts]
unifiwifioptimizer = "unifiwifioptimizer.cli.main:main"

# Kept in sync with [dependency-groups].dev below for pip/venv contributors (`pip install -e .[dev]`).
# Dev-only license review (never shipped; `./dev licenses` gates the runtime graph only): hypothesis and
# the transitive certifi are MPL-2.0 (file-level copyleft); the other direct dev tools are MIT,
# Apache-2.0 or BSD.
[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "hatch-vcs==0.5.0",
  "hatchling==1.32.4",
  "hypothesis==6.168.5",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
  "types-pyyaml==6.0.12.20260906",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "hatch-vcs==0.5.0",
  "hatchling==1.32.4",
  "hypothesis==6.168.5",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
  "types-pyyaml==6.0.12.20260906",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/unifiwifioptimizer"]

[tool.hatch.build.targets.sdist]
include = [
  "src/unifiwifioptimizer/",
  "tests/",
  "docs/",
  "pyproject.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "S",   # flake8-bandit
  "T20", # flake8-print
  "PTH", # flake8-use-pathlib
  "N",   # pep8-naming
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Terminal output is the responsibility of exactly these two layers.
"src/unifiwifioptimizer/cli/**" = ["T20"]
"src/unifiwifioptimizer/report/**" = ["T20"]
# Build helpers are command-line scripts; stderr diagnostics are their interface.
"scripts/**" = ["T20"]
# pytest's assert statements are the test mechanism, and subprocess use in tests drives the harness.
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/unifiwifioptimizer", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra -m 'not integration'"
markers = [
  "integration: needs the local Docker harness; excluded from the default run, run via ./dev test-integration",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["unifiwifioptimizer"]
branch = true

[tool.coverage.report]
# Hard floor for the whole package; per-layer soft targets live in CONTRIBUTING.md.
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.coverage.paths]
source = ["src/unifiwifioptimizer", "*/site-packages/unifiwifioptimizer"]

[tool.bandit]
# Paths are given on the command line (`./dev bandit`); this table only holds rule configuration.
