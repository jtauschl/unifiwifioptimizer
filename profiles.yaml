profiles:
  # Shipped WLAN baselines. Ready to use as-is, but adjust them if your
  # environment, client mix, or security policy needs something different.
  # Available presets: Standard, IoT, Hotspot, Throughput, Latency
  #
  # Profile field guide:
  # - wifi_bands: expected WLAN bands (2g, 5g)
  # - security_protocols: allowed security modes for a matching WLAN
  # - fast_roaming, mlo, bss_transition, uapsd, proxy_arp, multicast_*,
  #   pmf, hide_wifi_name, client_device_isolation, ap_name_in_beacon,
  #   band_steering: controller settings compared directly against the WLAN
  # - minrate_mode: auto or manual
  # - dtim_mode: default or custom
  # - minrate_*: expected values when minrate_mode is manual
  # - dtim_*: expected values when dtim_mode is custom
  # - group_rekey: always checked
  # - sae_*: checked when the WLAN uses a SAE-based security protocol
  # - roaming_assistant: whether Roaming Assistant / "Handoff Suggestions
  #   (802.11v)" should be enabled for this profile. Only the on/off
  #   expectation is profile-driven -- the RSSI threshold itself is always
  #   computed from the site's RF model (ALGORITHM.md §6/§7), never from the
  #   profile. Distinct from fast_roaming (802.11r) and bss_transition
  #   (the underlying 802.11v BSS Transition Management protocol support).

  # Baseline matching the current UniFi "Standard/Auto" 2.4/5 GHz WLAN behavior,
  # including band_steering (true): a freshly created Standard/Auto WLAN has
  # no2ghz_oui enabled by default, so this is a controller-default snapshot
  # value, not a deliberate deviation from it.
  Standard:
    wifi_bands:
      - 2g
      - 5g
    fast_roaming: false
    minrate_mode: auto
    multicast_broadcast_blocker: false
    multicast_to_unicast: false
    proxy_arp: false
    security_protocols:
      - WPA2
    pmf: Disabled
    hide_wifi_name: false
    client_device_isolation: false
    sae_anti_clogging: 5
    sae_sync_time: 5
    mlo: false
    bss_transition: true
    uapsd: false
    dtim_mode: default
    group_rekey: 0
    ap_name_in_beacon: false
    roaming_assistant: false
    band_steering: true

  # Baseline matching the current UniFi "IoT/Auto" 2.4 GHz WLAN behavior.
  # band_steering: false -- many IoT clients are 2.4-GHz-only, so steering
  # would be ineffective or counterproductive for this profile.
  IoT:
    wifi_bands:
      - 2g
    fast_roaming: false
    minrate_mode: auto
    multicast_broadcast_blocker: false
    multicast_to_unicast: false
    proxy_arp: false
    security_protocols:
      - WPA2
    pmf: Disabled
    hide_wifi_name: false
    client_device_isolation: false
    sae_anti_clogging: 5
    sae_sync_time: 5
    mlo: false
    bss_transition: false
    uapsd: false
    dtim_mode: default
    group_rekey: 0
    ap_name_in_beacon: false
    roaming_assistant: false
    band_steering: false

  # Baseline matching the current UniFi "Hotspot/Auto" 2.4/5 GHz WLAN
  # behavior (controller-default snapshot).
  Hotspot:
    wifi_bands:
      - 2g
      - 5g
    fast_roaming: false
    minrate_mode: auto
    multicast_broadcast_blocker: false
    multicast_to_unicast: false
    proxy_arp: false
    security_protocols:
      - Open
    pmf: Disabled
    hide_wifi_name: false
    client_device_isolation: true
    sae_anti_clogging: 5
    sae_sync_time: 5
    mlo: false
    bss_transition: true
    uapsd: false
    dtim_mode: default
    group_rekey: 0
    ap_name_in_beacon: false
    roaming_assistant: false
    band_steering: true

  # Throughput-oriented baseline for primary client WLANs on 2.4/5 GHz.
  # band_steering: true -- a deliberate best-practice recommendation, not a
  # UDM default snapshot -- dual-band clients are steered toward 5 GHz.
  Throughput:
    wifi_bands:
      - 2g
      - 5g
    fast_roaming: true
    minrate_mode: manual
    minrate_24_kbps: 12000
    minrate_5_kbps: 24000
    multicast_broadcast_blocker: false
    multicast_to_unicast: false
    proxy_arp: true
    security_protocols:
      - WPA2/WPA3
      - WPA2/WPA3 Enterprise
    pmf: Optional
    hide_wifi_name: false
    client_device_isolation: false
    sae_anti_clogging: 5
    sae_sync_time: 5
    mlo: false
    bss_transition: true
    uapsd: false
    dtim_mode: custom
    dtim_24: 3
    dtim_5: 3
    group_rekey: 3600
    ap_name_in_beacon: false
    roaming_assistant: true
    band_steering: true

  # Latency-oriented baseline for primary client WLANs on 2.4/5 GHz.
  # band_steering: true -- a deliberate best-practice recommendation, not a
  # UDM default snapshot -- dual-band clients are steered toward 5 GHz.
  Latency:
    wifi_bands:
      - 2g
      - 5g
    fast_roaming: true
    minrate_mode: manual
    minrate_24_kbps: 12000
    minrate_5_kbps: 24000
    multicast_broadcast_blocker: false
    multicast_to_unicast: false
    proxy_arp: true
    security_protocols:
      - WPA2/WPA3
      - WPA2/WPA3 Enterprise
    pmf: Optional
    hide_wifi_name: false
    client_device_isolation: false
    sae_anti_clogging: 5
    sae_sync_time: 5
    mlo: false
    bss_transition: true
    uapsd: true
    dtim_mode: custom
    dtim_24: 1
    dtim_5: 1
    group_rekey: 3600
    ap_name_in_beacon: false
    roaming_assistant: true
    band_steering: true
