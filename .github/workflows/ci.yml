# Push/PR workflow, kept to the minimal hosted floor on purpose. Lint, type checks, unit and
# integration tests, coverage, the lower-bound probe, the lock check and the license gate all run
# locally in `./dev ci`, enforced by the maintainer's machine-wide pre-push hook; re-running them on
# every push would bill verification the same commit already received. What stays here:
#   - semgrep: SAST that needs no project toolchain and runs identically everywhere.
#   - sbom: an SBOM for every push and PR, independent of local toolchain state, with the project's
#     own version written into the root component (uv omits it for a dynamic version).
#   - local-gate: the full `./dev ci` gate, but only for pull requests, where a contributor's clone
#     has no pre-push hook.
#   - ci-success: the single required status check the release/** ruleset points at.
name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.24"

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep==1.180.0
      - name: Run semgrep
        run: semgrep ci --config p/python --config p/secrets --config p/security-audit

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs derives the version from the nearest tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Generate SBOM with the project's version as root component
        run: ./dev sbom
      - name: Assert the root component carries a version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("sbom.cdx.json"))["metadata"]["component"].get("version", ""))')"
          if [[ -z "$version" ]]; then
            echo "SBOM root component has no version" >&2
            exit 1
          fi
          echo "SBOM root version: $version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  local-gate:
    name: Local gate (./dev ci) for pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
        with:
          uv-version: ${{ env.UV_VERSION }}
      - run: ./dev bootstrap
      - run: ./dev ci

  ci-success:
    name: CI success (aggregator)
    needs: [semgrep, sbom, local-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check all required jobs succeeded
        env:
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          LOCAL_GATE_RESULT: ${{ needs.local-gate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "semgrep=$SEMGREP_RESULT sbom=$SBOM_RESULT local-gate=$LOCAL_GATE_RESULT event=$EVENT_NAME"
          if [[ "$SEMGREP_RESULT" != "success" || "$SBOM_RESULT" != "success" ]]; then
            echo "A floor job did not succeed." >&2
            exit 1
          fi
          # local-gate runs only for pull requests; on a push its skipped result is the expected state.
          if [[ "$EVENT_NAME" == "pull_request" && "$LOCAL_GATE_RESULT" != "success" ]]; then
            echo "The local gate did not succeed on this pull request." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != "pull_request" && "$LOCAL_GATE_RESULT" != "skipped" ]]; then
            echo "Unexpected local-gate result '$LOCAL_GATE_RESULT' for a $EVENT_NAME event." >&2
            exit 1
          fi
