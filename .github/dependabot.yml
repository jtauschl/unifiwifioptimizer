# Dependabot reads this file only from the repository's default branch (main). Changes made on an
# open release/* branch become active once that branch is fast-forward-promoted to main.
#
# Not covered here: build-constraints.txt (refreshed as a release-checklist step), tool versions
# inlined in workflow run steps (semgrep, shfmt, actionlint, gitleaks), and the uv pin, which is
# declared in `dev` (UV_VERSION) and repeated in the workflows' `env.UV_VERSION`.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
