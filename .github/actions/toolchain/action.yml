# Installs the tools `./dev ci` needs beyond the runner image at pinned versions, so every gate runs the same
# ones. The shell, workflow and secret-scan tools are pinned here; uv comes in through the caller's version so
# one `UV_VERSION` stays the single source. Downloads go to the runner's temp directory: a file left in the
# workspace would make the release gate's clean-tree check fail.
name: toolchain
description: Install uv, shellcheck, shfmt, actionlint and gitleaks at the project's pinned versions.

inputs:
  uv-version:
    description: The uv version to install.
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: false
    - name: Install shellcheck, shfmt, actionlint, gitleaks
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        cd "$RUNNER_TEMP"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
